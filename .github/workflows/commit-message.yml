name: commit message

# Rejects assistant authorship trailers that a commit-msg hook cannot catch:
# the hook only runs on machines where it is installed, while this runs on
# every push regardless of what the author's tooling did locally.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  no-authorship-trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi

          # A new branch or a force-push can leave the range without a usable
          # base commit. Check just the tip in that case rather than failing.
          if ! git rev-parse --quiet --verify "${{ github.event.before }}" >/dev/null 2>&1; then
            range="-1 HEAD"
          fi

          echo "Checking commits in: $range"
          failed=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format='%s' "$sha")
            body=$(git log -1 --format='%B' "$sha")
            clean=1
            if printf '%s\n' "$body" | grep -inE '^[[:space:]]*co-authored-by:.*(claude|anthropic|chatgpt|openai|copilot|gemini|cursor|windsurf|codeium|aider)'; then
              echo "::error::$sha has an assistant authorship trailer"
              failed=1
              clean=0
            fi
            if printf '%s\n' "$body" | grep -inE 'generated (with|by) .*(claude|chatgpt|openai|copilot|gemini)|claude code|claude\.ai'; then
              echo "::error::$sha has a generated-by marker"
              failed=1
              clean=0
            fi
            [ "$clean" -eq 1 ] && echo "ok: $sha $subject"
          done <<< "$(git log --format='%H' $range)"

          if [ "$failed" -ne 0 ]; then
            echo "Remove the trailer or marker, then amend or rebase."
            exit 1
          fi
